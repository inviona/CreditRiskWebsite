version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: credit-risk-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=credit-risk-analysis
    networks:
      - credit-risk-network

  python-service:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: credit-risk-python
    ports:
      - "8000:8000"
    networks:
      - credit-risk-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: credit-risk-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/credit-risk-analysis
      - PYTHON_SERVICE_URL=http://python-service:8000
      - CLIENT_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      - mongodb
      - python-service
    networks:
      - credit-risk-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit-risk-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    depends_on:
      - backend
    networks:
      - credit-risk-network

volumes:
  mongodb_data:

networks:
  credit-risk-network:
    driver: bridge
